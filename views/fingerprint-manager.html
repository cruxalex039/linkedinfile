<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fingerprint Profile Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #0e76a8 0%, #0a5f85 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.8rem;
            font-weight: 500;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            color: #555;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-group select,
        .form-group input {
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: #0e76a8;
        }

        .btn {
            background: linear-gradient(135deg, #0e76a8 0%, #0a5f85 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(14, 118, 168, 0.3);
        }

        .btn-danger {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        }

        .btn-danger:hover {
            box-shadow: 0 8px 20px rgba(231, 76, 60, 0.3);
        }

        .profiles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .profile-card {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .profile-card:hover {
            border-color: #0e76a8;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .profile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .profile-id {
            font-family: 'Courier New', monospace;
            background: #0e76a8;
            color: white;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
        }

        .profile-actions {
            display: flex;
            gap: 10px;
        }

        .profile-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
        }

        .info-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .info-value {
            font-size: 14px;
            color: #333;
            font-weight: 500;
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-fresh { background: #d4edda; color: #155724; }
        .status-returning { background: #d1ecf1; color: #0c5460; }
        .status-frequent { background: #f8d7da; color: #721c24; }
        .status-captured { background: #fff3cd; color: #856404; }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #0e76a8;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔐 Fingerprint Profile Manager</h1>
            <p>Manage ISP, MAC address, and cookie fingerprint profiles for LinkedIn automation</p>
        </div>

        <div class="content">
            <!-- Generate New Profile Section -->
            <div class="section">
                <h2>Generate New Profile</h2>
                <form id="generateForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="sessionType">Session Type</label>
                            <select id="sessionType" name="sessionType">
                                <option value="fresh">Fresh (New User)</option>
                                <option value="returning">Returning User</option>
                                <option value="frequent">Frequent User</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="region">Region</label>
                            <select id="region" name="region">
                                <option value="North America">North America</option>
                                <option value="Europe">Europe</option>
                                <option value="Asia Pacific">Asia Pacific</option>
                                <option value="Australia">Australia</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="deviceType">Device Type</label>
                            <select id="deviceType" name="deviceType">
                                <option value="laptop">Laptop</option>
                                <option value="desktop">Desktop</option>
                                <option value="mobile">Mobile</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="connectionType">Connection Type</label>
                            <select id="connectionType" name="connectionType">
                                <option value="cable">Cable</option>
                                <option value="fiber">Fiber</option>
                                <option value="dsl">DSL</option>
                                <option value="wireless">Wireless</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="customISP">Custom ISP (Optional)</label>
                            <input type="text" id="customISP" name="customISP" placeholder="e.g., Comcast Cable">
                        </div>
                        <div class="form-group">
                            <label for="customVendor">Custom Vendor (Optional)</label>
                            <input type="text" id="customVendor" name="customVendor" placeholder="e.g., Apple, Dell, HP">
                        </div>
                    </div>
                    <button type="submit" class="btn">Generate Profile</button>
                </form>
            </div>

            <!-- Alert Messages -->
            <div id="alertContainer"></div>

            <!-- Profiles List Section -->
            <div class="section">
                <h2>Existing Profiles</h2>
                <div id="loadingProfiles" class="loading">
                    <div class="spinner"></div>
                    Loading profiles...
                </div>
                <div id="profilesContainer" class="profiles-grid hidden"></div>
            </div>
        </div>
    </div>

    <script>
        class FingerprintManager {
            constructor() {
                this.init();
            }

            init() {
                this.loadProfiles();
                this.setupEventListeners();
            }

            setupEventListeners() {
                document.getElementById('generateForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.generateProfile();
                });
            }

            async generateProfile() {
                const formData = new FormData(document.getElementById('generateForm'));
                const options = {};
                
                for (let [key, value] of formData.entries()) {
                    if (value.trim()) {
                        options[key] = value;
                    }
                }

                try {
                    const response = await fetch('/api/fingerprint/generate', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(options)
                    });

                    const result = await response.json();

                    if (result.success) {
                        this.showAlert('Profile generated successfully!', 'success');
                        this.loadProfiles(); // Refresh the list
                        document.getElementById('generateForm').reset();
                    } else {
                        this.showAlert('Error generating profile: ' + result.error, 'error');
                    }
                } catch (error) {
                    this.showAlert('Network error: ' + error.message, 'error');
                }
            }

            async loadProfiles() {
                try {
                    const response = await fetch('/api/fingerprint/profiles');
                    const result = await response.json();

                    document.getElementById('loadingProfiles').classList.add('hidden');

                    if (result.success) {
                        this.displayProfiles(result.profiles);
                    } else {
                        this.showAlert('Error loading profiles: ' + result.error, 'error');
                    }
                } catch (error) {
                    document.getElementById('loadingProfiles').classList.add('hidden');
                    this.showAlert('Network error: ' + error.message, 'error');
                }
            }

            displayProfiles(profiles) {
                const container = document.getElementById('profilesContainer');
                container.classList.remove('hidden');

                if (profiles.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: #666; grid-column: 1 / -1;">No profiles found. Generate your first profile above.</p>';
                    return;
                }

                container.innerHTML = profiles.map(profile => {
                    const createdDate = new Date(profile.createdAt).toLocaleDateString();
                    const lastUsedDate = profile.lastUsed ? new Date(profile.lastUsed).toLocaleDateString() : 'Never';
                    
                    return `
                        <div class="profile-card">
                            <div class="profile-header">
                                <div class="profile-id">${profile.profileId.substring(0, 8)}...</div>
                                <div class="profile-actions">
                                    <button class="btn" onclick="fingerprintManager.viewProfile('${profile.profileId}')">View</button>
                                    <button class="btn btn-danger" onclick="fingerprintManager.deleteProfile('${profile.profileId}')">Delete</button>
                                </div>
                            </div>
                            
                            <div class="profile-info">
                                <div class="info-item">
                                    <div class="info-label">Session Type</div>
                                    <div class="info-value">
                                        <span class="status-badge status-${profile.sessionType}">${profile.sessionType}</span>
                                    </div>
                                </div>
                                <div class="info-item">
                                    <div class="info-label">Region</div>
                                    <div class="info-value">${profile.region}</div>
                                </div>
                                <div class="info-item">
                                    <div class="info-label">Device</div>
                                    <div class="info-value">${profile.deviceType}</div>
                                </div>
                                <div class="info-item">
                                    <div class="info-label">ISP</div>
                                    <div class="info-value">${profile.isp}</div>
                                </div>
                                <div class="info-item">
                                    <div class="info-label">Created</div>
                                    <div class="info-value">${createdDate}</div>
                                </div>
                                <div class="info-item">
                                    <div class="info-label">Last Used</div>
                                    <div class="info-value">${lastUsedDate}</div>
                                </div>
                                <div class="info-item">
                                    <div class="info-label">Use Count</div>
                                    <div class="info-value">${profile.useCount || 0}</div>
                                </div>
                                <div class="info-item">
                                    <div class="info-label">File Size</div>
                                    <div class="info-value">${Math.round(profile.fileSize / 1024)} KB</div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            async viewProfile(profileId) {
                try {
                    const response = await fetch(`/api/fingerprint/profile/${profileId}`);
                    const result = await response.json();

                    if (result.success) {
                        const profile = result.profile;
                        const details = `
Profile ID: ${profile.profileId}

Network Information:
• ISP: ${profile.network.isp}
• ASN: ${profile.network.asn}
• Region: ${profile.network.region}
• Local IP: ${profile.network.localIP}
• Source Port: ${profile.network.sourcePort}
• Connection: ${profile.network.connectionType}
• Bandwidth: ${profile.network.bandwidth.download}/${profile.network.bandwidth.upload} Mbps
• Latency: ${profile.network.latency}ms

Device Information:
• MAC Address: ${profile.device.macAddress}
• Vendor: ${profile.device.vendor}
• Device Type: ${profile.device.deviceType}
• Hostname: ${profile.device.hostname}
• OS: ${profile.device.osFingerprint}

Browser Information:
• User Agent: ${profile.browser.userAgent}
• Viewport: ${profile.browser.viewport.width}x${profile.browser.viewport.height}
• Timezone: ${profile.browser.timezone}
• Language: ${profile.browser.language}

Cookies: ${profile.cookies.length} cookies configured
                        `;
                        alert(details);
                    } else {
                        this.showAlert('Error loading profile details: ' + result.error, 'error');
                    }
                } catch (error) {
                    this.showAlert('Network error: ' + error.message, 'error');
                }
            }

            async deleteProfile(profileId) {
                if (!confirm('Are you sure you want to delete this profile? This action cannot be undone.')) {
                    return;
                }

                try {
                    const response = await fetch(`/api/fingerprint/profile/${profileId}`, {
                        method: 'DELETE'
                    });

                    const result = await response.json();

                    if (result.success) {
                        this.showAlert('Profile deleted successfully!', 'success');
                        this.loadProfiles(); // Refresh the list
                    } else {
                        this.showAlert('Error deleting profile: ' + result.error, 'error');
                    }
                } catch (error) {
                    this.showAlert('Network error: ' + error.message, 'error');
                }
            }

            showAlert(message, type) {
                const alertContainer = document.getElementById('alertContainer');
                const alertDiv = document.createElement('div');
                alertDiv.className = `alert alert-${type}`;
                alertDiv.textContent = message;

                alertContainer.appendChild(alertDiv);

                setTimeout(() => {
                    alertDiv.remove();
                }, 5000);
            }
        }

        // Initialize the manager when the page loads
        const fingerprintManager = new FingerprintManager();
    </script>
</body>
</html>
